name: Summarize native dependency notice gaps
on:
  push:
    paths: ['.github/workflows/summarize-notice-gaps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Report only allowlisted dependency component names and missing-notice counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          release = json.loads(subprocess.check_output(['gh','api','/repos/arceustechlab-code/ArceusTechRemoteSupport-Sources/releases/402397093'],text=True))
          assert release['draft']
          summary = []
          for asset in release['assets']:
              match = re.fullmatch(r'candidate-494d39c-(customer|operator)-(windows-x64|windows-x86|macos-arm64|macos-x64)-REVIEW_REQUIRED.txt', asset['name'])
              if not match:
                  continue
              # Capture privately; never stream private draft files into public logs.
              raw = subprocess.check_output(['gh','api','/repos/arceustechlab-code/ArceusTechRemoteSupport-Sources/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'])
              assert len(raw) < 4096
              components = [line for line in raw.decode('utf-8').splitlines() if re.fullmatch(r'(rust|dart|vcpkg)/[A-Za-z0-9_.+/-]{1,180}', line)]
              summary.append({'role':match[1], 'platform':match[2], 'missing_notice_count':len(components), 'dependency_components':components})
          print(json.dumps(summary, indent=2))
          PY
