# Wait for targeted Intel operator DMG resource-busy retry.
# Verified repair input: run 37120988692 (source archive path correction)
name: Distribute verified Mac signing repairs
on:
  push:
    paths: ['.github/workflows/distribute-mac-signfix.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  clients:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify repaired Mac customers before public beta publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_mac_signfix.py
  operators:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify repaired Mac operators and retain private draft status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stage_mac_signfix.py
