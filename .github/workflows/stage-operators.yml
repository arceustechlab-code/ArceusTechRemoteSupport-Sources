name: Verify and stage private operator packages
on:
  push:
    paths:
      - '.github/workflows/stage-operators.yml'
      - 'scripts/stage_operators.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stage-operators-494d39c
  cancel-in-progress: false
jobs:
  operators:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify operator checksums and stage in a private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stage_operators.py
