name: Build private Windows standard-user candidates
'on':
  push:
    paths:
    - .github/workflows/windows-standard-user.yml
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
env:
  PYTHONUTF8: '1'
  SUPPORT_REQUIRE_CONFIGURED: '1'
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Verify and extract reviewed source 494d39c
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/candidate_source.py
    - name: Apply authorized user-session Windows profile and original/declared notices
      run: python scripts/windows_license_patch.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: support-bridge-${{ matrix.role }}
        path: client
        run-id: 37109995106
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: 15.0.6
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: '1.75'
        targets: x86_64-pc-windows-msvc
        components: rustfmt
    - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        flutter-version: 3.24.5
        channel: stable
        architecture: x64
    - name: Patch stock Flutter SDK as in upstream x64 build
      shell: bash
      run: 'cd "$(dirname "$(dirname "$(which flutter)")")"

        git apply "$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

        '
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
        doNotCache: false
    - name: Native dependencies
      working-directory: client
      shell: pwsh
      run: '& "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT/installed"

        if ($LASTEXITCODE -ne 0) { throw ''vcpkg failed'' }

        '
    - name: Configure public endpoints and branding
      shell: pwsh
      env:
        SUPPORT_ID_SERVER: ${{ vars.SUPPORT_ID_SERVER }}
        SUPPORT_RELAY_SERVER: ${{ vars.SUPPORT_RELAY_SERVER }}
        SUPPORT_PUBLIC_KEY: ${{ vars.SUPPORT_PUBLIC_KEY }}
        SUPPORT_SOURCE_URL: ${{ vars.SUPPORT_SOURCE_URL }}
        SUPPORT_ROLE: ${{ matrix.role }}
      run: 'python scripts/configure_ci.py

        if ($LASTEXITCODE -ne 0) { throw ''Public settings are incomplete or invalid; set all four variables, or leave all four empty for an unconfigured
        build'' }

        '
    - name: Inno Setup
      shell: pwsh
      run: "if (-not (Test-Path 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe')) {\n  choco install innosetup --version=6.4.3 -y --no-progress\n  if\
        \ ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }\n}\n"
    - name: Build, license collection, installer and corresponding sources
      shell: pwsh
      run: ./scripts/build-windows.ps1 -SkipConfigure
    - name: Save native packages to private draft only
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CANDIDATE_ROLE: ${{ matrix.role }}
        CANDIDATE_PLATFORM: windows-x64-licensefix
      run: python scripts/candidate_upload.py
    strategy:
      fail-fast: false
      matrix:
        role:
        - customer
        - operator
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        role:
        - customer
        - operator
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x86-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Verify and extract reviewed source 494d39c
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/candidate_source.py
    - name: Apply authorized user-session Windows profile and original/declared notices
      run: python scripts/windows_license_patch.py
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce
      with:
        version: 15.0.6
    - name: Rust x86 and server source-inventory toolchain
      shell: bash
      run: 'rustup toolchain install 1.85.1 --profile minimal --no-self-update

        rustup toolchain install nightly-2023-10-13-i686-pc-windows-msvc --target i686-pc-windows-msvc --component rustfmt --profile minimal --no-self-update
        --force-non-host

        rustup default nightly-2023-10-13-i686-pc-windows-msvc --force-non-host

        '
    - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
        doNotCache: false
    - name: Native x86 dependencies
      working-directory: client
      shell: pwsh
      run: '& "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x86-windows-static --x-install-root="$env:VCPKG_ROOT/installed"

        if ($LASTEXITCODE -ne 0) { throw ''vcpkg x86 failed'' }

        '
    - name: Configure existing public server and profile
      env:
        SUPPORT_ROLE: ${{ matrix.role }}
      run: python scripts/configure_ci.py
    - name: Pinned x86 Sciter engine and its separate EULA
      shell: bash
      run: 'mkdir -p work/sciter-runtime

        SDK=f33df075d9eb2f8d252cb88f1b2c8096e56197ed

        curl --fail --location --retry 3 "https://raw.githubusercontent.com/c-smile/sciter-sdk/$SDK/bin.win/x32/sciter.dll" -o work/sciter-runtime/sciter.dll

        curl --fail --location --retry 3 "https://raw.githubusercontent.com/c-smile/sciter-sdk/$SDK/license.htm" -o work/sciter-runtime/license.htm

        test "$(git hash-object work/sciter-runtime/sciter.dll)" = 6289acb74b28ba33464cf7fb69a12df025edc841

        test "$(git hash-object work/sciter-runtime/license.htm)" = 56a378af153f5814eb91cd1a4076cd81a44e04e3

        '
    - name: Inno Setup
      shell: pwsh
      run: "if (-not (Test-Path 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe')) {\n  choco install innosetup --version=6.4.3 -y --no-progress\n  if\
        \ ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }\n}\n"
    - name: Compile x86, verify PE, installer and resolved source archive
      shell: pwsh
      run: ./scripts/build-windows-x86.ps1
    - name: Save native packages to private draft only
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CANDIDATE_ROLE: ${{ matrix.role }}
        CANDIDATE_PLATFORM: windows-x86-licensefix
      run: python scripts/candidate_upload.py
