name: Verify existing RustDesk TCP and UDP protocol
on:
  push:
    paths:
      - '.github/workflows/protocol-readiness.yml'
      - 'scripts/probe_rustdesk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/probe_rustdesk.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-protocol-verification
          path: SERVER-PROTOCOL-VERIFICATION.json
