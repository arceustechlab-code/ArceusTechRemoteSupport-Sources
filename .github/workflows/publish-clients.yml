name: Verify and distribute existing client beta
on:
  push:
    paths:
      - '.github/workflows/publish-clients.yml'
      - 'scripts/publish_clients.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-clients-494d39c
  cancel-in-progress: false
jobs:
  distribution:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify corresponding sources, native packages and server; publish customer beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_clients.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: client-distribution-verification
          path: |
            verified-clients/RELEASE-VERIFICATION.json
            verified-clients/RELEASE-NOTES.md
            verified-clients/SHA256SUMS.txt
          if-no-files-found: ignore
