name: Verify anonymous Windows64 client download
on:
  push:
    paths: ['.github/workflows/verify-windows-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-downloads:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check direct downloads without GitHub authentication
        run: |
          python3 - <<'PY'
          import urllib.request
          base = 'https://github.com/arceustechlab-code/ArceusTechRemoteSupport-Sources/releases/download/v2026.10.03-windows-user-beta/'
          expected = {'ArceusTechRemoteSupport-Setup.exe':22900344, 'ArceusTechRemoteSupport-Windows-x64.zip':35887187}
          for name, size in expected.items():
              with urllib.request.urlopen(urllib.request.Request(base+name, method='HEAD'),timeout=30) as response:
                  assert response.status == 200
                  assert int(response.headers['Content-Length']) == size
                  assert 'text/html' not in response.headers.get('Content-Type','')
                  print(name, 'anonymous download available', response.status, size, 'bytes')
          PY
